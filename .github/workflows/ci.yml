name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows-aarch64
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            platform: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: srtstripper
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: rustfmt check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }} -- -D warnings

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: golden
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          BIN="srtstripper/target/${{ matrix.target }}/release/srtstripper"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PY=python3
          "$PY" -c "import sys" >/dev/null 2>&1 || PY=python
          "$PY" srtstripper/tools/golden_diff.py --rust-bin "$BIN"

      - name: smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/srtstripper"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          printf '1\r\n00:00:01,000 --> 00:00:02,000\r\nHello smoke test.\r\n1234\r\n' > sample.srt
          "$BIN" sample.srt
          test -s "sample - alpha.txt"
          grep -Fq "Hello smoke test." "sample - alpha.txt"
          if grep -q "1234" "sample - alpha.txt"; then exit 1; fi
          "$BIN" --keep-timecodes --numbered sample.srt
          grep -Fq "00001 [00:00:01] Hello smoke test." "sample - timecodes numbered.txt"
          printf '1\n00:00:02,000 --> 00:00:03,000\nSecond smoke.\n' > sample2.srt
          "$BIN" sample.srt sample2.srt
          test -s "sample2 - alpha.txt"
          grep -Fq "Second smoke." "sample2 - alpha.txt"

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/srtstripper.exe" ]; then
            cp "target/${{ matrix.target }}/release/srtstripper.exe" "dist/srtstripper-${{ matrix.platform }}.exe"
          else
            cp "target/${{ matrix.target }}/release/srtstripper" "dist/srtstripper-${{ matrix.platform }}"
          fi

      - name: version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $vi = (Get-Item "dist/srtstripper-${{ matrix.platform }}.exe").VersionInfo
          if ($vi.FileVersion -ne "$ver.0" -or $vi.ProductVersion -ne "$ver.0") {
            throw "version metadata mismatch: file=$($vi.FileVersion) product=$($vi.ProductVersion) expected=$ver.0"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: srtstripper-${{ matrix.platform }}
          path: srtstripper/dist/*
          if-no-files-found: error

  windows-installers:
    name: windows-installers
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: srtstripper-windows-*
          merge-multiple: true

      - name: install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          (Get-Item $iscc).VersionInfo.FileVersion

      - name: build installers
        shell: pwsh
        run: ./installer/build-installers.ps1 -DistDir dist -OutDir out

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: out/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-installers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            srtstripper: strips non-alphabetic lines from SRT/text subtitle files. Standalone Rust binary, zero runtime dependencies.

            Binaries in this release:
            - srtstripper-windows-x86_64.exe: GUI-subsystem build, so no console window ever appears when another app launches it; attaches the parent console for interactive use; filled-in Properties/Details metadata.
            - srtstripper-windows-aarch64.exe: native Windows ARM64 build with the same GUI-subsystem behavior and version metadata.
            - srtstripper-linux-x86_64
            - srtstripper-linux-x86_64-musl: statically linked, no glibc dependency; runs on any Linux distribution, including Alpine
            - srtstripper-linux-aarch64
            - srtstripper-linux-aarch64-musl: statically linked ARM64 build for Alpine and other non-glibc systems
            - srtstripper-macos-arm64 (Apple Silicon)

            Windows installers (per-user, no admin rights, adds the install folder to the user PATH):
            - srtstripper-windows-x86_64-setup.exe
            - srtstripper-windows-aarch64-setup.exe

            Usage: `srtstripper "file.srt" ["file2.srt" ...] [--keep-timecodes] [--numbered | --numbered-only] [--out "result.txt"]`

            Drop several SRT/text files onto the exe to convert them in one run; each input prints its own PASS line. An optional `srtstripper.json` next to the exe sets the mode for runs without flags, for example `{"mode": "timecodes"}`; command line flags win.

            Install with curl (Linux x86_64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Linux ARM64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-aarch64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Alpine and other musl systems, x86_64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64-musl
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Alpine and other musl systems, ARM64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-aarch64-musl
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Verify downloads against `SHA256SUMS` attached to this release.

            Install with curl (macOS, Apple Silicon):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-macos-arm64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Windows x86_64, PowerShell or cmd):

                curl.exe -L -o srtstripper.exe https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-windows-x86_64.exe

            Install with curl (Windows ARM64, PowerShell or cmd):

                curl.exe -L -o srtstripper.exe https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-windows-aarch64.exe

            The Windows setup executables install to `%LOCALAPPDATA%\Programs\srtstripper` and register an uninstaller in Settings > Apps; silent install with `/VERYSILENT`, add `/TASKS=` to skip the PATH entry.

            Full usage, requirements and known presentation deviations are in the README. Changelog: https://github.com/chezhenkie/srt-subtitle-stripper/blob/main/CHANGELOG.md
