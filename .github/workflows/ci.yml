name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            platform: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TGT: ${{ matrix.target }}
    defaults:
      run:
        working-directory: srtstripper
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: rustfmt check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release --locked --target "$TGT" -- -D warnings

      - name: build
        run: cargo build --release --locked --target "$TGT"

      - name: test
        run: cargo test --release --locked --target "$TGT"

      - name: smoke
        shell: bash
        run: |
          BIN="target/$TGT/release/srtstripper"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          printf '1\r\n00:00:01,000 --> 00:00:02,000\r\nHello smoke test.\r\n1234\r\n' > sample.srt
          "$BIN" sample.srt
          test -s "sample - alpha.txt"
          grep -Fq "Hello smoke test." "sample - alpha.txt"
          if grep -q "1234" "sample - alpha.txt"; then exit 1; fi
          "$BIN" --keep-timecodes --numbered sample.srt
          grep -Fq "00001 [00:00:01] Hello smoke test." "sample - timecodes numbered.txt"

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/$TGT/release/srtstripper.exe" ]; then
            cp "target/$TGT/release/srtstripper.exe" "dist/srtstripper-${{ matrix.platform }}.exe"
          else
            cp "target/$TGT/release/srtstripper" "dist/srtstripper-${{ matrix.platform }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: srtstripper-${{ matrix.platform }}
          path: srtstripper/dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            srtstripper: standalone Rust port of the original Python SRT stripper. Strips non-alphabetic lines from SRT/text subtitle files with byte-for-byte identical output and zero runtime dependencies.

            Binaries in this release:
            - srtstripper-windows-x86_64.exe: GUI-subsystem build, so no console window ever appears when another app launches it; attaches the parent console for interactive use; filled-in Properties/Details metadata.
            - srtstripper-linux-x86_64
            - srtstripper-linux-x86_64-musl: statically linked, no glibc dependency; runs on any Linux distribution, including Alpine
            - srtstripper-macos-arm64 (Apple Silicon)

            Usage: `srtstripper "file.srt" [--keep-timecodes] [--numbered | --numbered-only] [--out "result.txt"]`

            Install with curl (Linux):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Alpine and other musl systems):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64-musl
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (macOS, Apple Silicon):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-macos-arm64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Windows, PowerShell or cmd):

                curl.exe -L -o srtstripper.exe https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-windows-x86_64.exe

            Full usage, requirements and known presentation deviations are in the README. Changelog: https://github.com/chezhenkie/srt-subtitle-stripper/blob/main/CHANGELOG.md
