name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            platform: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: srtstripper
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: rustfmt check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }} -- -D warnings

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: golden
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          BIN="srtstripper/target/${{ matrix.target }}/release/srtstripper"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PY=python3
          "$PY" -c "import sys" >/dev/null 2>&1 || PY=python
          "$PY" srtstripper/tools/golden_diff.py --rust-bin "$BIN"

      - name: smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/srtstripper"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          printf '1\r\n00:00:01,000 --> 00:00:02,000\r\nHello smoke test.\r\n1234\r\n' > sample.srt
          "$BIN" sample.srt
          test -s "sample - alpha.txt"
          grep -Fq "Hello smoke test." "sample - alpha.txt"
          if grep -q "1234" "sample - alpha.txt"; then exit 1; fi
          "$BIN" --keep-timecodes --numbered sample.srt
          grep -Fq "00001 [00:00:01] Hello smoke test." "sample - timecodes numbered.txt"

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/srtstripper.exe" ]; then
            cp "target/${{ matrix.target }}/release/srtstripper.exe" "dist/srtstripper-${{ matrix.platform }}.exe"
          else
            cp "target/${{ matrix.target }}/release/srtstripper" "dist/srtstripper-${{ matrix.platform }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: srtstripper-${{ matrix.platform }}
          path: srtstripper/dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            srtstripper: strips non-alphabetic lines from SRT/text subtitle files. Standalone Rust binary, zero runtime dependencies.

            Binaries in this release:
            - srtstripper-windows-x86_64.exe: GUI-subsystem build, so no console window ever appears when another app launches it; attaches the parent console for interactive use; filled-in Properties/Details metadata.
            - srtstripper-linux-x86_64
            - srtstripper-linux-x86_64-musl: statically linked, no glibc dependency; runs on any Linux distribution, including Alpine
            - srtstripper-linux-aarch64
            - srtstripper-linux-aarch64-musl: statically linked ARM64 build for Alpine and other non-glibc systems
            - srtstripper-macos-arm64 (Apple Silicon)

            Usage: `srtstripper "file.srt" [--keep-timecodes] [--numbered | --numbered-only] [--out "result.txt"]`

            Install with curl (Linux x86_64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Linux ARM64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-aarch64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Alpine and other musl systems, x86_64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-x86_64-musl
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Alpine and other musl systems, ARM64):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-linux-aarch64-musl
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Verify downloads against `SHA256SUMS` attached to this release.

            Install with curl (macOS, Apple Silicon):

                curl -fsSL -o srtstripper https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-macos-arm64
                sudo install -m 0755 srtstripper /usr/local/bin/srtstripper

            Install with curl (Windows, PowerShell or cmd):

                curl.exe -L -o srtstripper.exe https://github.com/chezhenkie/srt-subtitle-stripper/releases/latest/download/srtstripper-windows-x86_64.exe

            Full usage, requirements and known presentation deviations are in the README. Changelog: https://github.com/chezhenkie/srt-subtitle-stripper/blob/main/CHANGELOG.md
