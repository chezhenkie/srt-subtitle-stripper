[package]
name = "srtstripper"
version = "1.0.0"
edition = "2021"
description = "Strip non-alphabetic lines from SRT/text files, with optional timecodes. Rust port of strip_srt.py."
license = "MIT"
repository = "https://github.com/chezhenkie/srt-subtitle-stripper"

[[bin]]
name = "srtstripper"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true
